name: Build WhisperPin APK

on:
  push:
    branches: [ "**" ]
  workflow_dispatch:
    inputs:
      local_format_prototype:
        description: Build the Gemma GPU text/list/email prototype
        type: boolean
        default: false
      publish_prerelease:
        description: Publish the prototype APK as a downloadable prerelease
        type: boolean
        default: false

permissions:
  contents: read

env:
  PROTOTYPE: ${{ (github.event_name == 'workflow_dispatch' && inputs.local_format_prototype) || (github.event_name == 'push' && contains(github.event.head_commit.message, '[local-layout-test]')) }}

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install pinned Android tools
        run: sdkmanager "platforms;android-34" "build-tools;35.0.0" "ndk;28.2.13676358" "cmake;3.22.1"

      - name: Grant execute permission for gradlew
        run: chmod +x ./gradlew

      - name: Run native alignment controller tests
        run: python3 -m unittest scripts/test_check_apk_native_alignment.py -v

      - name: Run transcribe.cpp native bundle contract
        run: ANDROID_NDK_HOME="$ANDROID_HOME/ndk/28.2.13676358" bash scripts/test_transcribe_cpp_bundle.sh

      - name: Build isolated local formatter
        if: env.PROTOTYPE != 'true'
        run: ANDROID_NDK_HOME="$ANDROID_HOME/ndk/28.2.13676358" DICTAI_CMAKE="$ANDROID_HOME/cmake/3.22.1/bin/cmake" bash scripts/build_local_format_android.sh

      - name: Run unit tests and build selected APK
        shell: bash
        run: |
          args=(testDebugUnitTest assembleDebug --stacktrace)
          if [[ "$PROTOTYPE" == true ]]; then args+=(-PlocalFormatPrototype=true); fi
          ./gradlew --no-daemon --max-workers=2 '-Dorg.gradle.jvmargs=-Xmx4g -XX:MaxMetaspaceSize=1g -Dfile.encoding=UTF-8' "${args[@]}"

      - name: Check native library alignment and denylist
        run: python3 scripts/check_apk_native_alignment.py app/build/outputs/apk/debug/app-debug.apk

      - name: Verify signature and 16 KB ZIP alignment
        run: |
          "$ANDROID_HOME/build-tools/35.0.0/zipalign" -c -P 16 4 app/build/outputs/apk/debug/app-debug.apk
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify app/build/outputs/apk/debug/app-debug.apk

      - name: Verify packaged model and prepare download
        run: python3 scripts/prepare_ci_apk.py

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.PROTOTYPE == 'true' && 'dictai-local-layout-test' || 'whisperpin-debug-apk' }}
          path: dist/*
          compression-level: 0
          if-no-files-found: error

  publish-test:
    needs: build
    if: (github.event_name == 'workflow_dispatch' && inputs.local_format_prototype && inputs.publish_prerelease) || (github.event_name == 'push' && contains(github.event.head_commit.message, '[local-layout-test]'))
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dictai-local-layout-test
          path: dist
      - name: Publish downloadable test APK
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        shell: bash
        run: |
          cd dist
          sha256sum -c SHA256SUMS
          tag="gemma-test-$GITHUB_RUN_ID"
          printf '%s\n' \
            'DictAI 0.8.5 Android ARM64 : Gemma 4 E2B, LiteRT-LM GPU + MTP, thinking désactivé.' \
            'Installez cette APK en mise à jour : Gemma déjà téléchargé est conservé. Première installation : touchez Installer Gemma 4 E2B pour le téléchargement unique de 2,6 Go, reprenable et vérifié.' \
            'Le menu des formats propose Texte (sans LLM) et Texte corrigé (local ou cloud selon les réglages). Texte reste le choix initial, y compris pour les notes longues ; aucune activation automatique de l’IA selon la longueur.' \
            'Les mails et textes corrigés de 60 mots ou plus disposent de dix secondes au maximum pour terminer le calcul local. Une réponse prête est utilisée immédiatement. Mails courts : huit secondes ; listes et textes corrigés courts : cinq secondes.' \
            'Gemma peut corriger certaines fautes de forme, retirer les hésitations et répétitions adjacentes et structurer le corps du texte en paragraphes. Les changements de contenu non reconnus conservent la transcription source.' \
            'Le banc distingue les corrections autorisées des critères de structure et mesure les paragraphes du corps, ainsi que les écarts à cinq, huit et dix secondes. La limite du banc reste vingt secondes.' \
            'Essai expérimental : les tests sur ordinateur ne mesurent pas la latence GPU Android. Aucun repli cloud automatique ; le cloud se choisit avec votre clé API.' \
            'APK compilée, testée et vérifiée par GitHub Actions.' > release-notes.md
          gh release create "$tag" dictai-local-layout-test.apk SHA256SUMS \
            --target "$GITHUB_SHA" --prerelease --latest=false \
            --title 'DictAI 0.8.5 — correction souple et choix du texte sans IA' --notes-file release-notes.md
