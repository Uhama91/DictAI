name: Build DictAI APK

on:
  push:
    branches: [ "**" ]
  workflow_dispatch:
    inputs:
      local_format_prototype:
        description: Build the Gemma GPU text/list/email prototype
        type: boolean
        default: false
      gemma4_finetuned_pilot:
        description: Build the CPU Gemma4 fine-tuned pilot APK
        type: boolean
        default: false
      publish_prerelease:
        description: Publish the selected prototype or pilot APK as a downloadable prerelease
        type: boolean
        default: false

permissions:
  contents: read

env:
  PROTOTYPE: ${{ (github.event_name == 'workflow_dispatch' && inputs.local_format_prototype) || (github.event_name == 'push' && (contains(github.event.head_commit.message, '[local-layout-test]') || contains(github.event.head_commit.message, '[local-layout-artifact]'))) }}
  GEMMA4_PILOT: ${{ (github.event_name == 'workflow_dispatch' && inputs.gemma4_finetuned_pilot) || (github.event_name == 'push' && contains(github.event.head_commit.message, '[gemma4-v6-test]')) }}

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools

      - name: Install pinned Android tools
        run: sdkmanager "platforms;android-34" "build-tools;35.0.0" "ndk;28.2.13676358" "cmake;3.22.1"

      - name: Grant execute permission for gradlew
        run: chmod +x ./gradlew

      - name: Run native alignment controller tests
        run: python3 -m unittest scripts/test_check_apk_native_alignment.py -v

      - name: Run APK packaging contract tests
        run: python3 -m unittest scripts/test_prepare_ci_apk.py -v

      - name: Run Gemma4 pilot publication contract tests
        run: python3 -m unittest scripts/test_gemma4_pilot_publication.py -v

      - name: Run transcribe.cpp native bundle contract
        run: ANDROID_NDK_HOME="$ANDROID_HOME/ndk/28.2.13676358" bash scripts/test_transcribe_cpp_bundle.sh

      - name: Build isolated local formatter
        if: env.PROTOTYPE != 'true' || env.GEMMA4_PILOT == 'true'
        run: ANDROID_NDK_HOME="$ANDROID_HOME/ndk/28.2.13676358" DICTAI_CMAKE="$ANDROID_HOME/cmake/3.22.1/bin/cmake" bash scripts/build_local_format_android.sh

      - name: Run unit tests and build selected APK
        shell: bash
        run: |
          args=(testDebugUnitTest assembleDebug assembleDebugAndroidTest --stacktrace)
          if [[ "$GEMMA4_PILOT" == true ]]; then
            args+=(-Pgemma4FineTunedPilot=true)
          elif [[ "$PROTOTYPE" == true ]]; then
            args+=(-PlocalFormatPrototype=true)
          fi
          ./gradlew --no-daemon --max-workers=2 '-Dorg.gradle.jvmargs=-Xmx4g -XX:MaxMetaspaceSize=1g -Dfile.encoding=UTF-8' "${args[@]}"

      - name: Check native library alignment and denylist
        run: python3 scripts/check_apk_native_alignment.py app/build/outputs/apk/debug/app-debug.apk

      - name: Verify signature and 16 KB ZIP alignment
        run: |
          "$ANDROID_HOME/build-tools/35.0.0/zipalign" -c -P 16 4 app/build/outputs/apk/debug/app-debug.apk
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify app/build/outputs/apk/debug/app-debug.apk

      - name: Verify packaged model and prepare download
        run: |
          if [[ "$GEMMA4_PILOT" == true ]]; then
            variant=pilot
          elif [[ "$PROTOTYPE" == true ]]; then
            variant=gpu
          else
            variant=normal
          fi
          python3 scripts/prepare_ci_apk.py --variant "$variant"

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.GEMMA4_PILOT == 'true' && 'dictai-gemma4-v6-test' || env.PROTOTYPE == 'true' && 'dictai-local-layout-test' || 'dictai-debug-apk' }}
          path: dist/*
          compression-level: 0
          if-no-files-found: error

  publish-test:
    needs: build
    if: (!inputs.gemma4_finetuned_pilot && !(github.event_name == 'push' && contains(github.event.head_commit.message, '[gemma4-v6-test]')) && ((github.event_name == 'workflow_dispatch' && inputs.local_format_prototype && inputs.publish_prerelease) || (github.event_name == 'push' && contains(github.event.head_commit.message, '[local-layout-test]'))))
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dictai-local-layout-test
          path: dist
      - name: Publish downloadable test APK
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        shell: bash
        run: |
          cd dist
          sha256sum -c SHA256SUMS
          tag="gemma-test-$GITHUB_RUN_ID"
          printf '%s\n' \
            'DictAI 0.9.5 Android ARM64 : notes protégées, correction plus accessible et interface plus chaleureuse.' \
            'Message : le parcours direct est conservé. Note ouverte volontairement : la pastille met la dictée en pause ou la reprend ; elle ne dépose plus la note dans un autre champ.' \
            'Le bouton Insérer… affiche le texte à confirmer. La note reste enregistrée après insertion. Le glissement vers le haut réaffiche la note ; Terminer la range dans Mes notes.' \
            'Correction : acquisition du focus et du clavier coordonnée après le toucher ; position du curseur préservée ; bouton Modifier pour agrandir ; défilement automatique suspendu pendant la correction.' \
            'Mes notes distingue titre, aperçu et date. Tons charbon chaud, crème et sauge ; cartes et commandes plus arrondies. Captures, photos, vocabulaire et exports PDF/HTML conservés.' \
            'Tests JVM, compilation des tests Android et vérifications de signature/alignement. Aucun appareil Android accessible : fluidité tactile, clavier et rendu visuel restent à vérifier sur téléphone.' > release-notes.md
          gh release create "$tag" dictai-local-layout-test.apk SHA256SUMS \
            --target "$GITHUB_SHA" --prerelease --latest=false \
            --title 'DictAI 0.9.5 — notes protégées et édition plus douce' --notes-file release-notes.md

  publish-gemma4-pilot:
    needs: build
    if: >-
      (github.event_name == 'workflow_dispatch' && inputs.gemma4_finetuned_pilot && inputs.publish_prerelease) ||
      (github.event_name == 'push' && contains(github.event.head_commit.message, '[gemma4-v6-test]'))
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dictai-gemma4-v6-test
          path: dist
      - name: Publish experimental Gemma 4 V6 pilot APK
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        shell: bash
        run: |
          cd dist
          sha256sum -c SHA256SUMS
          tag="gemma4-v6-test-$GITHUB_RUN_ID"
          cat > release-notes.md <<'EOF'
          DictAI 0.9.9 — mesure de la latence sur Poco.

          Cette préversion du pilote expérimental active le même chemin local CPU Gemma4 V6 pour les textes, les listes et les e-mails. Le formatage progressif éditable et les garde-fous de fidélité restent inchangés.

          L'APK ne contient aucun poids.

          Ce diagnostic mesure la latence ; il ne constitue pas encore un correctif de vitesse. Il utilise les mêmes poids Gemma4 V6 du checkpoint 1956 et le téléchargement existant d'environ 3,93 Go. Les poids Q6_K avec les matrices Q/O en F16 et leur provenance sont disponibles sur la page du modèle : https://github.com/Uhama91/DictAI/releases/tag/gemma4-v6-1956-q6-evaluation-20260920. L'installation met à jour le pilote avec la même signature et le code 38.

          Depuis l'écran Diagnostics, l'action « Mesurer la latence — 6 textes » lance 18 appels synthétiques sur quelques minutes et permet de copier le rapport. Le banc utilise uniquement des textes fictifs ; le diagnostic d'une dictée personnelle contient des durées et compteurs, sans son texte. Le dernier post-traitement mesure séparément les temps ASR, de correction et des segments partiels. Une mesure réelle sur Poco reste requise.

          Aucun score de qualité ni mesure de latence sur téléphone n'est revendiqué ici. La comparaison des modèles et les mesures sur Poco restent à faire. Cette publication est expérimentale et n'est pas un produit officiel Google.
          EOF
          gh release create "$tag" dictai-gemma4-v6-test.apk SHA256SUMS \
            --target "$GITHUB_SHA" --prerelease --latest=false \
            --title 'DictAI 0.9.9 — mesure de la latence sur Poco' --notes-file release-notes.md
