name: Build DictAI APK

on:
  push:
    branches: [ "**" ]
  workflow_dispatch:
permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools

      - name: Install pinned Android tools
        run: sdkmanager "platforms;android-34" "build-tools;35.0.0" "ndk;28.2.13676358" "cmake;3.22.1"

      - name: Grant execute permission for gradlew
        run: chmod +x ./gradlew

      - name: Run native alignment controller tests
        run: python3 -m unittest scripts/test_check_apk_native_alignment.py -v

      - name: Run transcribe.cpp native bundle contract
        run: ANDROID_NDK_HOME="$ANDROID_HOME/ndk/28.2.13676358" bash scripts/test_transcribe_cpp_bundle.sh

      - name: Run unit tests and build APK
        run: ./gradlew --no-daemon --max-workers=2 '-Dorg.gradle.jvmargs=-Xmx4g -XX:MaxMetaspaceSize=1g -Dfile.encoding=UTF-8' testDebugUnitTest assembleDebug assembleDebugAndroidTest --stacktrace

      - name: Check native library alignment and denylist
        run: python3 scripts/check_apk_native_alignment.py app/build/outputs/apk/debug/app-debug.apk

      - name: Verify signature and 16 KB ZIP alignment
        run: |
          "$ANDROID_HOME/build-tools/35.0.0/zipalign" -c -P 16 4 app/build/outputs/apk/debug/app-debug.apk
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify app/build/outputs/apk/debug/app-debug.apk

      - name: Verify local speech bundle and prepare download
        run: python3 scripts/prepare_ci_apk.py

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: dictai-debug-apk
          path: dist/*
          compression-level: 0
          if-no-files-found: error
