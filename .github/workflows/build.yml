name: Build WhisperPin APK

on:
  push:
    branches: [ "**" ]
  workflow_dispatch:
    inputs:
      local_format_prototype:
        description: Build the Gemma GPU text/list/email prototype
        type: boolean
        default: false
      publish_prerelease:
        description: Publish the prototype APK as a downloadable prerelease
        type: boolean
        default: false

permissions:
  contents: read

env:
  PROTOTYPE: ${{ (github.event_name == 'workflow_dispatch' && inputs.local_format_prototype) || (github.event_name == 'push' && contains(github.event.head_commit.message, '[local-layout-test]')) }}

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install pinned Android tools
        run: sdkmanager "platforms;android-34" "build-tools;35.0.0" "ndk;28.2.13676358" "cmake;3.22.1"

      - name: Grant execute permission for gradlew
        run: chmod +x ./gradlew

      - name: Run native alignment controller tests
        run: python3 -m unittest scripts/test_check_apk_native_alignment.py -v

      - name: Run transcribe.cpp native bundle contract
        run: ANDROID_NDK_HOME="$ANDROID_HOME/ndk/28.2.13676358" bash scripts/test_transcribe_cpp_bundle.sh

      - name: Build isolated local formatter
        if: env.PROTOTYPE != 'true'
        run: ANDROID_NDK_HOME="$ANDROID_HOME/ndk/28.2.13676358" DICTAI_CMAKE="$ANDROID_HOME/cmake/3.22.1/bin/cmake" bash scripts/build_local_format_android.sh

      - name: Run unit tests and build selected APK
        shell: bash
        run: |
          args=(testDebugUnitTest assembleDebug --stacktrace)
          if [[ "$PROTOTYPE" == true ]]; then args+=(-PlocalFormatPrototype=true); fi
          ./gradlew --no-daemon --max-workers=2 '-Dorg.gradle.jvmargs=-Xmx4g -XX:MaxMetaspaceSize=1g -Dfile.encoding=UTF-8' "${args[@]}"

      - name: Check native library alignment and denylist
        run: python3 scripts/check_apk_native_alignment.py app/build/outputs/apk/debug/app-debug.apk

      - name: Verify signature and 16 KB ZIP alignment
        run: |
          "$ANDROID_HOME/build-tools/35.0.0/zipalign" -c -P 16 4 app/build/outputs/apk/debug/app-debug.apk
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify app/build/outputs/apk/debug/app-debug.apk

      - name: Verify packaged model and prepare download
        run: python3 scripts/prepare_ci_apk.py

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.PROTOTYPE == 'true' && 'dictai-local-layout-test' || 'whisperpin-debug-apk' }}
          path: dist/*
          compression-level: 0
          if-no-files-found: error

  publish-test:
    needs: build
    if: (github.event_name == 'workflow_dispatch' && inputs.local_format_prototype && inputs.publish_prerelease) || (github.event_name == 'push' && contains(github.event.head_commit.message, '[local-layout-test]'))
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dictai-local-layout-test
          path: dist
      - name: Publish downloadable test APK
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        shell: bash
        run: |
          cd dist
          sha256sum -c SHA256SUMS
          tag="gemma-test-$GITHUB_RUN_ID"
          printf '%s\n' \
            'DictAI 0.9.3 Android ARM64 : correction du vocabulaire lettre par lettre, captures et photos enregistrées dans Photos / DictAI.' \
            'Le mot ou petit groupe source est suivi pendant les effacements et la nouvelle saisie, sans sélection obligatoire. La suggestion temporaire nécessite un appui explicite pour enregistrer la règle locale, appliquée pendant la transcription sans LLM.' \
            'Une capture ou photo est enregistrée dans Pictures/DictAI et copiée au presse-papier. Le collage depuis Gboard dépend toujours de l’application destinataire ; les images sont aussi accessibles depuis son sélecteur de photos.' \
            'Glisser vers la gauche conserve volontairement la note et ses captures, avec au maximum dix images placées près du texte visible lors de chaque capture. La transcription ordinaire ne reçoit pas de repères image supplémentaires.' \
            'Mes notes : lire, partager ou enregistrer un PDF ; exporter un HTML autonome avec ses images intégrées. Un agent outillé peut extraire les images du HTML ; leur analyse visuelle n’est pas automatique dans tous les chatbots.' \
            'Caméra interne conservée. Aucun appel LLM pour les images ou exports. Texte sans LLM, Gemma GPU/MTP avec thinking désactivé et délais inchangés.' \
            'Tests JVM et compilation APK/tests Android dans Actions. Pas d’appareil Android connecté à Codex : galerie, gestes IME/Gboard et rendu PDF restent à valider sur téléphone.' > release-notes.md
          gh release create "$tag" dictai-local-layout-test.apk SHA256SUMS \
            --target "$GITHUB_SHA" --prerelease --latest=false \
            --title 'DictAI 0.9.3 — vocabulaire lettre par lettre, galerie et notes illustrées' --notes-file release-notes.md
