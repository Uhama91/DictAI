name: Gemma 3 Attention + MLP V2 CPU pilot

on:
  push:
    branches:
      - codex/gemma4-layout-validation
    paths:
      - tools/gemma3-repair-mlp/**
      - .github/workflows/train-gemma3-repair-mlp.yml

permissions:
  contents: read

jobs:
  gemma3-repair-mlp:
    # Run only after the V2 reviews; the separate V2 config is the second gate.
    if: ${{ contains(github.event.head_commit.message, '[gemma3-mlp-authorized]') }}
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    permissions:
      contents: write

    steps:
      - name: Initialize Gemma 3 MLP CI workspace paths
        shell: bash
        run: |
          {
            printf 'GEMMA3_WORKSPACE=%s/gemma3-repair-mlp-workspace\n' "$RUNNER_TEMP"
            printf 'GEMMA3_PREPARED_DIR=%s/gemma3-repair-mlp-output\n' "$RUNNER_TEMP"
            printf 'GEMMA3_RESULTS_DIR=%s/gemma3-repair-mlp-results\n' "$RUNNER_TEMP"
            printf 'PYTHONPATH=%s/gemma3-repair-mlp-workspace:%s/gemma3-repair-mlp-workspace/src:%s/gemma3-repair-mlp-workspace/scripts\n' "$RUNNER_TEMP" "$RUNNER_TEMP" "$RUNNER_TEMP"
          } >> "$GITHUB_ENV"

      - name: Check out workflow and V1 helpers without persisting credentials
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Require reviewed V2 run lock
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          path = Path("tools/gemma3-repair-mlp/ci_config.json")
          config = json.loads(path.read_text(encoding="utf-8"))
          if config.get("schema_version") != 1:
              raise SystemExit("unsupported MLP V2 CI lock schema")
          if config.get("status") != "ready":
              raise SystemExit("MLP V2 CI lock is not ready; download and execution are disabled")
          if config.get("source_payload_lock") != "tools/gemma3-repair/ci_config.json":
              raise SystemExit("MLP V2 must use the existing reviewed V1 payload lock")
          PY

      - name: Install pinned CPU dependencies without a wheel cache
        run: >-
          python -m pip install --no-cache-dir
          --requirement tools/gemma3-repair/requirements-linux-cpu.txt

      - name: Run V2 transport and workflow tests before download
        env:
          PYTHONPATH: ${{ github.workspace }}/tools/gemma3-repair-mlp/src
        run: >-
          python -m pytest -q
          tools/gemma3-repair-mlp/tests/test_workflow_contract.py
          tools/gemma3-repair-mlp/tests/test_runtime_staging.py

      - name: Validate the existing reviewed V1 draft asset lock
        id: release-lock
        run: >-
          python tools/gemma3-repair/payload.py release-lock
          --config tools/gemma3-repair/ci_config.json
          --github-output "$GITHUB_OUTPUT"

      - name: Download the exact reviewed V1 draft payload
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: >-
          python tools/gemma4-eval/scripts/download_release_asset.py
          --repo Uhama91/DictAI
          --release-id '${{ steps.release-lock.outputs.release_id }}'
          --asset-name '${{ steps.release-lock.outputs.archive_name }}'
          --destination "$RUNNER_TEMP/${{ steps.release-lock.outputs.archive_name }}"
          --sha256 '${{ steps.release-lock.outputs.archive_sha256 }}'
          --bytes '${{ steps.release-lock.outputs.archive_bytes }}'

      - name: Verify archive and extract the allowlisted V1 workspace
        run: >-
          python tools/gemma3-repair/payload.py extract
          --archive "$RUNNER_TEMP/${{ steps.release-lock.outputs.archive_name }}"
          --output "$GEMMA3_WORKSPACE"
          --sha256 '${{ steps.release-lock.outputs.archive_sha256 }}'
          --bytes '${{ steps.release-lock.outputs.archive_bytes }}'
          --max-archive-bytes 2000000000
          --max-expanded-bytes 1500000000

      - name: Refuse to replace V1 files; stage and hash the three reviewed V2 runtime files
        run: >-
          python tools/gemma3-repair-mlp/stage_runtime.py
          --source-root tools/gemma3-repair-mlp
          --workspace "$GEMMA3_WORKSPACE"

      - name: Smoke import only from the extracted V1 workspace
        working-directory: ${{ runner.temp }}
        env:
          PYTHONPATH: ${{ runner.temp }}/gemma3-repair-mlp-workspace:${{ runner.temp }}/gemma3-repair-mlp-workspace/src:${{ runner.temp }}/gemma3-repair-mlp-workspace/scripts
        run: |
          unset GH_TOKEN GITHUB_TOKEN HF_TOKEN HUGGINGFACE_HUB_TOKEN
          python -c 'import asr_postclean.training, asr_postclean.evaluation, asr_postclean.gemma3_mlp_adapter, scripts.supervise_gemma4_parent1956_export'
          python "$GEMMA3_WORKSPACE/scripts/run_gemma3_repair_mlp_v2.py" --help >/dev/null

      - name: Run tiny-model MLP V2 CPU tests from the extracted workspace
        working-directory: ${{ runner.temp }}
        env:
          GEMMA3_WORKSPACE: ${{ runner.temp }}/gemma3-repair-mlp-workspace
          PYTHONPATH: ${{ runner.temp }}/gemma3-repair-mlp-workspace:${{ runner.temp }}/gemma3-repair-mlp-workspace/src:${{ runner.temp }}/gemma3-repair-mlp-workspace/scripts
          HF_HUB_OFFLINE: '1'
          TRANSFORMERS_OFFLINE: '1'
          OMP_NUM_THREADS: '4'
          MKL_NUM_THREADS: '4'
          OPENBLAS_NUM_THREADS: '4'
          TOKENIZERS_PARALLELISM: 'false'
        run: |
          unset GH_TOKEN GITHUB_TOKEN HF_TOKEN HUGGINGFACE_HUB_TOKEN
          python -m pytest -q "$GITHUB_WORKSPACE/tools/gemma3-repair-mlp/tests/test_gemma3_repair_mlp_v2.py"

      - name: Prepare sealed MLP V2 inputs without loading a model
        working-directory: ${{ runner.temp }}
        env:
          HF_HUB_CACHE: ${{ runner.temp }}/gemma3-repair-mlp-workspace/base/hub
          HF_HUB_OFFLINE: '1'
          TRANSFORMERS_OFFLINE: '1'
        run: |
          unset GH_TOKEN GITHUB_TOKEN HF_TOKEN HUGGINGFACE_HUB_TOKEN
          python "$GEMMA3_WORKSPACE/scripts/run_gemma3_repair_mlp_v2.py" prepare \
            --config "$GEMMA3_WORKSPACE/configs/gemma3_repair_mlp_v2.json" \
            --child-dataset "$GEMMA3_WORKSPACE/data_gemma3_repair_v1" \
            --old-valid "$GEMMA3_WORKSPACE/data_v3/valid.jsonl" \
            --parent-manifest "$GEMMA3_WORKSPACE/parent/manifest.json" \
            --parent-adapter "$GEMMA3_WORKSPACE/parent/best" \
            --output-dir "$GEMMA3_PREPARED_DIR"

      - name: Evaluate the unchanged V3 parent on all 108 frozen cases
        working-directory: ${{ runner.temp }}
        env:
          HF_HUB_CACHE: ${{ runner.temp }}/gemma3-repair-mlp-workspace/base/hub
          HF_HUB_OFFLINE: '1'
          TRANSFORMERS_OFFLINE: '1'
          OMP_NUM_THREADS: '4'
          MKL_NUM_THREADS: '4'
          OPENBLAS_NUM_THREADS: '4'
          TOKENIZERS_PARALLELISM: 'false'
        run: |
          unset GH_TOKEN GITHUB_TOKEN HF_TOKEN HUGGINGFACE_HUB_TOKEN
          python "$GEMMA3_WORKSPACE/scripts/run_gemma3_repair_mlp_v2.py" evaluate \
            --prepared-dir "$GEMMA3_PREPARED_DIR" --model parent \
            --output-dir "$GEMMA3_PREPARED_DIR/parent_evaluation" --execute

      - name: Require the complete parent baseline before training
        working-directory: ${{ runner.temp }}
        env:
          HF_HUB_CACHE: ${{ runner.temp }}/gemma3-repair-mlp-workspace/base/hub
          HF_HUB_OFFLINE: '1'
          TRANSFORMERS_OFFLINE: '1'
          OMP_NUM_THREADS: '4'
          MKL_NUM_THREADS: '4'
          OPENBLAS_NUM_THREADS: '4'
          TOKENIZERS_PARALLELISM: 'false'
        run: |
          unset GH_TOKEN GITHUB_TOKEN HF_TOKEN HUGGINGFACE_HUB_TOKEN
          python - <<'PY'
          import json
          from pathlib import Path

          root = Path("${{ runner.temp }}") / "gemma3-repair-mlp-output"
          manifest = json.loads((root / "parent_evaluation/manifest.json").read_text())
          budget = json.loads((root / "evaluation_budget.json").read_text())
          phase = budget.get("phases", {}).get("parent", {})
          if (manifest.get("status") != "completed" or manifest.get("records_expected") != 108
                  or manifest.get("records_written") != 108 or manifest.get("model_loaded") is not True
                  or phase.get("status") != "completed"):
              raise SystemExit("parent baseline incomplete; MLP training is forbidden")
          PY

      - name: Train exactly one 64-update MLP continuation
        working-directory: ${{ runner.temp }}
        env:
          HF_HUB_CACHE: ${{ runner.temp }}/gemma3-repair-mlp-workspace/base/hub
          HF_HUB_OFFLINE: '1'
          TRANSFORMERS_OFFLINE: '1'
          OMP_NUM_THREADS: '4'
          MKL_NUM_THREADS: '4'
          OPENBLAS_NUM_THREADS: '4'
          TOKENIZERS_PARALLELISM: 'false'
        run: |
          unset GH_TOKEN GITHUB_TOKEN HF_TOKEN HUGGINGFACE_HUB_TOKEN
          python "$GEMMA3_WORKSPACE/scripts/run_gemma3_repair_mlp_v2.py" train \
            --prepared-dir "$GEMMA3_PREPARED_DIR" --execute

      - name: Require the completed 64-update MLP adapter
        working-directory: ${{ runner.temp }}
        env:
          HF_HUB_CACHE: ${{ runner.temp }}/gemma3-repair-mlp-workspace/base/hub
          HF_HUB_OFFLINE: '1'
          TRANSFORMERS_OFFLINE: '1'
          OMP_NUM_THREADS: '4'
          MKL_NUM_THREADS: '4'
          OPENBLAS_NUM_THREADS: '4'
          TOKENIZERS_PARALLELISM: 'false'
        run: |
          unset GH_TOKEN GITHUB_TOKEN HF_TOKEN HUGGINGFACE_HUB_TOKEN
          python - <<'PY'
          import json
          from pathlib import Path

          root = Path("${{ runner.temp }}") / "gemma3-repair-mlp-output"
          manifest = json.loads((root / "training/manifest.json").read_text())
          if manifest.get("status") != "completed" or manifest.get("completed_updates") != 64:
              raise SystemExit("MLP training incomplete; candidate evaluation is forbidden")
          PY

      - name: Evaluate the expanded MLP candidate on the same 108 cases
        working-directory: ${{ runner.temp }}
        env:
          HF_HUB_CACHE: ${{ runner.temp }}/gemma3-repair-mlp-workspace/base/hub
          HF_HUB_OFFLINE: '1'
          TRANSFORMERS_OFFLINE: '1'
          OMP_NUM_THREADS: '4'
          MKL_NUM_THREADS: '4'
          OPENBLAS_NUM_THREADS: '4'
          TOKENIZERS_PARALLELISM: 'false'
        run: |
          unset GH_TOKEN GITHUB_TOKEN HF_TOKEN HUGGINGFACE_HUB_TOKEN
          python "$GEMMA3_WORKSPACE/scripts/run_gemma3_repair_mlp_v2.py" evaluate \
            --prepared-dir "$GEMMA3_PREPARED_DIR" --model candidate \
            --output-dir "$GEMMA3_PREPARED_DIR/candidate_evaluation" --execute

      - name: Package allowlisted reports and synthetic predictions
        if: always()
        run: >-
          python tools/gemma3-repair/package_results.py
          --prepared-dir "$GEMMA3_PREPARED_DIR"
          --output-dir "$GEMMA3_RESULTS_DIR"

      - name: Upload diagnostic artifact, including incomplete-run reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gemma3-repair-mlp-v2-review
          path: ${{ runner.temp }}/gemma3-repair-mlp-results
          if-no-files-found: ignore
          retention-days: 14
